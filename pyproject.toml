[project]
name = "deep-agent-learning"
version = "0.1.0"
description = "A small, traceable LangChain Deep Agents learning project"
readme = "README.md"
authors = [
    { name = "Junwen Wu", email = "junwenwu+microsoft@microsoft.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25,<2",
    "deepagents>=0.7.11,<0.8",
    "langchain-openai>=1.1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.11,<0.12",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "pytest",
    "ruff",
    "tqdm",
]

[project.scripts]
deep-agent-learning = "deep_agent_learning.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
